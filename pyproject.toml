[project]
name = "py-photos-organize-tpv"
version = "1.2.0"
description = "Script to organize photos by date of file (create), EXIF, and others arguments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coloredlogs>=15.0.1",
    "google-genai>=2.18.1",
    "imageio-ffmpeg>=0.6.0",
    "openai>=3.1.0",
    "pereiras-common @ git+https://github.com/TalesPV/pereiras-scripts.git@v0.3.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["py_photos_organize_tpv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
